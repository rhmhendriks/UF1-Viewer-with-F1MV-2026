productName: "UF1-Viewer-2026"
appId: "com.rhmhendriks.uf1viewer.2026"
copyright: "Copyright © 2026 rhmhendriks (fork of MRAJEKO/UF1-Viewer)"

generateUpdatesFilesForAllChannels: true
asar: true

npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

directories:
    output: "out"

# ── macOS ─────────────────────────────────────────────────────────────────────
mac:
    icon: "src/icons/windows/logo.png"
    category: "public.app-category.utilities"
    darkModeSupport: true
    target:
        - target: "dmg"
          arch:
              - x64
              - arm64
        - target: "zip"
          arch:
              - x64
              - arm64

dmg:
    title: "UF1 Viewer 2026"
    contents:
        - x: 130
          y: 220
        - x: 410
          y: 220
          type: link
          path: "/Applications"
    window:
        width: 540
        height: 380

# ── Windows ───────────────────────────────────────────────────────────────────
win:
    icon: "src/icons/windows/logo.png"
    target:
        - target: "nsis"
          arch:
              - x64
              - arm64
        - target: "portable"
          arch:
              - x64

nsis:
    oneClick: false
    perMachine: false
    allowElevation: true
    allowToChangeInstallationDirectory: true
    createDesktopShortcut: true
    createStartMenuShortcut: true
    shortcutName: "UF1 Viewer 2026"

# ── Linux ─────────────────────────────────────────────────────────────────────
linux:
    icon: "src/icons/windows/logo.png"
    category: "Utility"
    maintainer: "rhmhendriks"
    description: "Ultimate F1 Viewer – 2026 Season Edition"
    desktop:
        Name: "UF1 Viewer 2026"
        GenericName: "Formula 1 Viewer"
        Comment: "Live timing overlay for Formula 1 – 2026 Season"
        Categories: "Utility;Sports;"
        Keywords: "F1;Formula1;Racing;Timing;"
    target:
        - target: "AppImage"
          arch:
              - x64
              - arm64
        - target: "deb"
          arch:
              - x64
              - arm64
        - target: "rpm"
          arch:
              - x64

deb:
    depends:
        - "libgtk-3-0"
        - "libnotify4"
        - "libnss3"
        - "libxss1"
        - "libxtst6"
        - "xdg-utils"
        - "libatspi2.0-0"
        - "libsecret-1-0"

appImage:
    category: "Utility"

publish:
    provider: "github"
